<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글래스 스크린</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #player-container { width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="player-container"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. 영상 ID 변경 감지 (영상 로드)
        database.ref('current_video').on('value', (snapshot) => {
            const videoId = snapshot.val();
            if (videoId) {
                const container = document.getElementById('player-container');
                // enablejsapi=1 파라미터를 추가해야 제어가 가능합니다.
                container.innerHTML = `
                    <iframe id="yt-player" 
                            src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&controls=1" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>`;
            }
        });

        // 2. 재생/일시정지 명령 감지 (PostMessage 방식)
        database.ref('video_state').on('value', (snapshot) => {
            const state = snapshot.val();
            const iframe = document.getElementById('yt-player');
            if (iframe && iframe.contentWindow) {
                const command = (state === 'play') ? 'playVideo' : 'pauseVideo';
                iframe.contentWindow.postMessage(JSON.stringify({
                    'event': 'command',
                    'func': command,
                    'args': ''
                }), '*');
            }
        });
    </script>
</body>
</html>
