<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글래스 스크린</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #player { width: 100vw; height: 100vh; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="player"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let player;

        // 1. YouTube IFrame API 로드
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            // 영상 ID 변경 감지 및 플레이어 생성/로드
            database.ref('current_video').on('value', (snapshot) => {
                const videoId = snapshot.val();
                if (!videoId) return;

                if (!player) {
                    player = new YT.Player('player', {
                        height: '100%', width: '100%', videoId: videoId
                    });
                } else {
                    player.loadVideoById(videoId);
                }
            });

            // 2. 재생/일시정지 명령 감지
            database.ref('video_state').on('value', (snapshot) => {
                const state = snapshot.val();
                if (!player) return;

                if (state === 'play') {
                    player.playVideo();
                } else if (state === 'pause') {
                    player.pauseVideo();
                }
            });
        }
    </script>
</body>
</html>
