<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글래스 스크린</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #player { width: 100vw; height: 100vh; outline: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="player" tabindex="0"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/" };
        if (!firebase.firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let player;

        function onYouTubeIframeAPIReady() {
            database.ref('current_video').on('value', (s) => {
                const vid = s.val();
                if(!vid) return;
                if(!player) player = new YT.Player('player', {videoId: vid, playerVars: {autoplay: 1}});
                else player.loadVideoById(vid);
            });
            database.ref('video_state').on('value', (s) => {
                if(s.val() === 'play') player.playVideo();
                else if(s.val() === 'pause') player.pauseVideo();
            });
        }

        // 1. 일반 클릭: 재생/일시정지 토글
        document.addEventListener('click', () => {
            if (player && player.getPlayerState) {
                if (player.getPlayerState() === 1) player.pauseVideo();
                else player.playVideo();
            }
        });

        // 2. 더블 클릭: 포커스 강제 복구 (포커스 탈출 문제 해결)
        document.addEventListener('dblclick', () => {
            const playerDiv = document.getElementById('player');
            playerDiv.focus(); // 포커스를 다시 영상 영역으로!
            console.log("포커스 복구 완료");
        });

        // 3. 밴드 입력용 엔터키 대응
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (player && player.getPlayerState) {
                    if (player.getPlayerState() === 1) player.pauseVideo();
                    else player.playVideo();
                }
            }
        });
    </script>
</body>
</html>
