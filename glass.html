<!DOCTYPE html>
<html>
<head>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>body{margin:0; background:black;} #player{width:100vw; height:100vh;}</style>
</head>
<body>
    <div id="player"></div>
    <script>
        const db = firebase.initializeApp({databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/"}).database();
        let player;
        function onYouTubeIframeAPIReady() {
            db.ref('current_video').on('value', (s) => {
                const vid = s.val();
                if(!player) player = new YT.Player('player', {videoId: vid, playerVars: {autoplay: 1}});
                else player.loadVideoById(vid);
            });
            db.ref('control_cmd').on('value', (s) => {
                const cmd = s.val();
                if(cmd.action === 'play') player.playVideo();
                else if(cmd.action === 'pause') player.pauseVideo();
            });
        }
    </script>
</body>
</html>
