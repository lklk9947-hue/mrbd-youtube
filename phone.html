<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글래스 리모컨</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f4f9; }
        h2 { color: #333; }
        input { width: 80%; max-width: 400px; padding: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
        .btn-group { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 16px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-send { background-color: #007bff; }
        .btn-play { background-color: #28a745; }
        .btn-pause { background-color: #dc3545; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>🕶️ 글래스 리모컨</h2>
    <p>유튜브 영상 주소(URL) 또는 ID를 입력하세요</p>
    <input type="text" id="video-input" placeholder="https://www.youtube.com/watch?v=...">
    <br>
    <button class="btn-send" onclick="sendVideo()">영상 전송하기</button>

    <div class="btn-group">
        <button id="toggle-btn" class="btn-play" onclick="toggleState()">▶ 재생</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // 현재 상태 추적 변수
        let isPlaying = false;

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        function sendVideo() {
            const inputVal = document.getElementById('video-input').value;
            if (!inputVal) { alert("유튜브 링크를 입력해 주세요!"); return; }
            const finalVideoId = extractVideoId(inputVal);
            database.ref('current_video').set(finalVideoId)
                .then(() => {
                    alert("안경으로 영상을 보냈습니다!");
                    document.getElementById('video-input').value = "";
                })
                .catch((error) => { alert("전송 실패: " + error.message); });
        }

        // 재생/일시정지 토글 함수
        function toggleState() {
            const btn = document.getElementById('toggle-btn');
            const newState = isPlaying ? 'pause' : 'play';
            
            database.ref('video_state').set(newState)
                .then(() => {
                    isPlaying = !isPlaying;
                    // 버튼 상태 변경
                    btn.textContent = isPlaying ? '⏸ 일시정지' : '▶ 재생';
                    btn.className = isPlaying ? 'btn-pause' : 'btn-play';
                    console.log("상태 변경: " + newState);
                })
                .catch((error) => { alert("상태 변경 실패: " + error.message); });
        }
    </script>
</body>
</html>
