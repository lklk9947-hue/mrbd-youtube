<!DOCTYPE html>
<html>
<body>
    <input id="vid" placeholder="유튜브 링크 입력">
    <button onclick="sendVid()">전송</button>
    <hr>
    <button onclick="sendCmd('play')">▶ 재생</button>
    <button onclick="sendCmd('pause')">⏸ 일시정지</button>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const db = firebase.initializeApp({databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/"}).database();
        function sendVid() {
            const val = document.getElementById('vid').value;
            const id = val.split('v=')[1]?.split('&')[0] || val;
            db.ref('current_video').set(id);
        }
        function sendCmd(act) {
            db.ref('control_cmd').set({action: act, time: Date.now()});
        }
    </script>
</body>
</html>
