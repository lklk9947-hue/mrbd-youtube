<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글래스 리모컨</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f4f9; }
        h2 { color: #333; }
        input { width: 80%; max-width: 400px; padding: 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
        button { padding: 15px 30px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>🕶️ 글래스 리모컨</h2>
    <p>유튜브 영상 주소(URL) 또는 ID를 입력하세요</p>
    
    <input type="text" id="video-input" placeholder="https://www.youtube.com/watch?v=...">
    <br>
    <button onclick="sendVideo()">영상 전송하기</button>

    <script>
        // 파이어베이스 설정
        const firebaseConfig = { databaseURL: "https://mrbd-bedd7-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 유튜브 링크에서 ID만 추출하는 마법의 함수
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url.trim();
        }

        function sendVideo() {
            const inputVal = document.getElementById('video-input').value;
            
            if (!inputVal) {
                alert("유튜브 링크를 입력해 주세요!");
                return;
            }

            // 전체 링크가 들어와도 자동으로 ID만 정제함
            const finalVideoId = extractVideoId(inputVal);

            database.ref('current_video').set(finalVideoId)
                .then(() => {
                    alert("안경으로 영상을 보냈습니다!");
                    document.getElementById('video-input').value = ""; // 입력창 비우기
                })
                .catch((error) => {
                    alert("전송 실패: " + error.message);
                });
        }
    </script>
</body>
</html>
