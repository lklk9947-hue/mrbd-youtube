<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글래스 리모컨</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; text-align: center; }
        input { width: 80%; padding: 12px; font-size: 16px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 84%; padding: 12px; font-size: 16px; background-color: #ff0000; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .info { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>🕶️ 글래스 리모컨</h2>
    <p>유튜브 영상 ID를 입력하세요</p>
    
    <input type="text" id="videoIdInput" placeholder="예: HYgNtqcgec8">
    <button onclick="sendVideo()">영상 전송하기</button>

    <div class="info">
        * 팁: 유튜브 ID인 <b>HYgNtqcgec8</b>를 그대로 입력해 보세요.
    </div>

    <script>
        const DB_URL = "https://mrbd-bedd7-default-rtdb.firebaseio.com/current_video.json";

        function sendVideo() {
            const videoId = document.getElementById('videoIdInput').value.trim();
            if (!videoId) return alert('ID를 입력해 주세요.');

            fetch(DB_URL, {
                method: 'PUT',
                body: JSON.stringify(videoId)
            })
            .then(response => {
                if(response.ok) alert('안경으로 영상을 보냈습니다!');
            })
            .catch(error => alert('전송 실패: ' + error));
        }
    </script>
</body>
</html>
